name: Release Packd
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require main branch and successful verification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: RELEASE_VERSION=${{ github.sha }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Trigger configured container host
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --max-time 60 -X POST -H 'Content-Type: application/json' --data "{\"image\":\"$IMAGE\"}" "$DEPLOY_HOOK_URL"
      - name: Verify release readiness
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$APP_URL"
          for attempt in $(seq 1 24); do
            revision=$(curl --fail --silent --show-error --max-time 15 "$APP_URL/api/version" | jq -r '.revision') || revision=""
            if test "$revision" = "$GITHUB_SHA"; then
              curl --fail --silent --show-error --max-time 15 "$APP_URL/api/health"
              exit 0
            fi
            sleep 10
          done
          echo "The requested revision did not become ready."
          exit 1
