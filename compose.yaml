name: packd
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: packd
      POSTGRES_PASSWORD: packd_local_only
      POSTGRES_DB: packd
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packd -d packd"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    restart: unless-stopped
    build: ./frontend
    ports:
      - "127.0.0.1:${PACKD_PORT:-3000}:3000"
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://packd:packd_local_only@db:5432/packd
      AUTH_URL: http://localhost:${PACKD_PORT:-3000}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
volumes:
  postgres_data:
