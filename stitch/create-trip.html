<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Packd - Create Trip</title>

        body {

            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
    </style>

                      "accent-tint": "#FFE7EC",

                      "error-container": "#ffdad6",
                      "on-secondary-fixed-variant": "#474746",
                      "tertiary-container": "#00a85a",
                      "on-tertiary-container": "#003317",
                      "surface-bright": "#FFE7EC",
                      "on-secondary": "#ffffff",
                      "surface-dim": "#efd4d5",
                      "secondary-container": "#e2dfde",
                      "on-error-container": "#93000a",

                      "surface-container-lowest": "#ffffff",
                      "surface-container-highest": "#f7dcdd",
                      "background": "#FFE7EC",

                      "success": "#2BB673",

                      "on-background": "#1A1A1A",

                      "outline": "#8e7071",
                      "ink-secondary": "#6B6B6B",

                      "inverse-on-surface": "#ffeced",
                      "surface-container-low": "#fff0f0",
                      "secondary-fixed": "#e5e2e1",

</head>
<body class="bg-bg-warm min-h-screen flex flex-col items-center justify-start text-on-surface">
<!-- Top Navigation Bar (Minimized for Transactional Flow) -->
<header class="w-full sticky top-0 z-40 flex justify-start items-center px-edge-mobile py-md bg-bg-warm">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
</header>
<main class="w-full max-w-md px-edge-mobile flex-1 flex flex-col justify-center pb-xxl">
<!-- Progress Indicator -->
<div class="flex gap-2 mb-xl">
<div class="h-1 flex-1 rounded-full bg-primary"></div>
<div class="h-1 flex-1 rounded-full bg-border-subtle"></div>
<div class="h-1 flex-1 rounded-full bg-border-subtle"></div>
</div>
<!-- Headline & Subtext -->
<section class="mb-xxl">
<h1 class="font-display text-display text-on-surface mb-xs tracking-tight">
                Where are we going?
            </h1>
<p class="font-body text-body text-ink-secondary">
                Give your adventure a name.
            </p>
</section>
<!-- Main Input Container -->
<div class="relative group">
<input autofocus="" class="w-full bg-surface border-none rounded-[20px] p-md py-lg text-h2 font-h2 text-on-surface placeholder:text-on-surface-variant/40 shadow-[0_4px_16px_rgba(0,0,0,0.06)] focus:ring-2 focus:ring-primary outline-none transition-all duration-300" id="trip-name" placeholder="e.g., Amalfi Coast Summer" type="text"/>
<div class="absolute right-md top-1/2 -translate-y-1/2 opacity-0 group-focus-within:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary">edit</span>
</div>
</div>
<!-- Decorative Aesthetic Element: Abstract Map/Texture -->
<div class="mt-xxl w-full aspect-video rounded-[20px] overflow-hidden opacity-80 mix-blend-multiply bg-surface-container">
<div class="w-full h-full relative" data-alt="A soft-focus, minimalist travel photography shot of a winding road in the Italian countryside. The lighting is golden hour, warm and serene, with a high-key off-white aesthetic. The image is clean, editorial, and features subtle tones of muted terracotta and soft sage greens, perfectly complementing a premium travel app UI." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDwJDHCJ1K7_WF8d0db670KVuhZiA3YHaCoUMQK77mjE6smi8Zhi-6pKXbnB0jioXfSQvAylhF55A6Ojnex5msHuNFnrqAWKF48n6rVZlms0OnzY7rzalnIHQ8g4sFNn067eBAwlJALxM_p19I_PeKn27kxkDafhgQ9bHO7O-1hQpuo0k8XEsbOSa_5s4mZoIkJKiCPgzjjkzFKUOvXIxP4LsZ_rgOzO0-ZWu25NJdhgH79YkjlsUg7')">
</div>
</div>
</main>
<!-- Fixed Action Footer -->
<footer class="fixed bottom-0 w-full max-w-md px-edge-mobile pb-xxl pt-md bg-gradient-to-t from-bg-warm via-bg-warm to-transparent">
<button class="w-full h-[56px] bg-primary text-on-primary rounded-full font-body-medium text-body-medium shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" id="next-btn">
            Next
            <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</footer>
<script>
        // Simple micro-interaction for the input
        const input = document.getElementById('trip-name');
        const nextBtn = document.getElementById('next-btn');

        input.addEventListener('input', (e) => {
            if (e.target.value.trim().length > 0) {
                nextBtn.classList.remove('opacity-50', 'pointer-events-none');
                nextBtn.classList.add('translate-y-0');
            } else {
                nextBtn.classList.add('opacity-50', 'pointer-events-none');
            }
        });

        // Initialize state
        if (!input.value) {
            nextBtn.classList.add('opacity-50', 'pointer-events-none');
        }

        // Action on next
        nextBtn.addEventListener('click', () => {
            // Success animation or navigation logic
            nextBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
            setTimeout(() => {
                // Mock navigation
                console.log('Navigating to step 2...');
            }, 800);
        });
    </script>
</body></html>
