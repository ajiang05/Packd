<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('article').forEach(card => {
            card.addEventListener('click', () => {
                // Subtle ripple effect or transition logic could go here
                console.log('Navigating to trip details...');
            });
        });

        // Simple observer to fade in items on scroll
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('opacity-100', 'translate-y-0');
                    entry.target.classList.remove('opacity-0', 'translate-y-4');
                }
            });
        }, observerOptions);

        document.querySelectorAll('article').forEach(card => {
            card.classList.add('opacity-0', 'translate-y-4', 'transition-all', 'duration-500');
            observer.observe(card);
        });
    </script>
