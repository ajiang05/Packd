<h2 class="font-h1 text-h1 text-on-surface">Create your account.</h2>
<p class="font-body text-body text-on-surface-variant max-w-[280px] mx-auto">Join your friends and start planning your next adventure together.</p>

</p>

</footer>

<!-- BottomNavBar Suppressed for Transactional/Focused Screen per Semantic Shell Mandate -->
<script>
        // Simple micro-interaction for buttons
        document.querySelectorAll('.social-button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('scale-[0.98]');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('scale-[0.98]');
            });
        });
    </script>
