<input class="checkbox-custom w-6 h-6 border-2 border-primary rounded-xl appearance-none checked:bg-primary checked:border-primary transition-all relative after:content-['✓'] after:absolute after:hidden after:checked:block after:text-white after:text-sm after:font-bold after:left-1/2 after:-translate-x-1/2 after:top-1/2 after:-translate-y-1/2" type="checkbox"/>

</label>

</a>

<script>
        // Micro-interactions for the checklist items
        document.querySelectorAll('.checkbox-custom').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const label = e.target.nextElementSibling;
                if (e.target.checked) {
                    label.style.opacity = '0.5';
                    // Optional: ripple or sound effect logic here
                } else {
                    label.style.opacity = '1';
                }
            });
        });
    </script>
