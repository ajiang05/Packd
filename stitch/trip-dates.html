<script>

        endDisplay.innerText = "Aug 16, 2024";

        const days = document.querySelectorAll('.calendar-day');
        let selections = [12, 16];

        days.forEach(day => {
            day.addEventListener('click', () => {
                const dayNum = parseInt(day.getAttribute('data-day'));
                
                // Placeholder logic for range selection demo
                // In a real app, this would handle start/end toggle logic
                console.log('Selected day:', dayNum);
                
                // Add a little tap ripple/feedback effect

        });
