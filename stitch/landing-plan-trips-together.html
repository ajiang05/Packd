<style>

<body class="bg-bg-warm min-h-screen flex flex-col text-on-surface">
<!-- Top Navigation (Contextual Suppression Logic: Hidden because this is a Welcome/Splash screen) -->
<main class="flex-grow flex flex-col items-center justify-center px-edge-mobile py-xl relative overflow-hidden">
<!-- Subtle Atmospheric Background Pattern -->

</div>

<h2 class="font-display text-display text-primary tracking-tight">Packd</h2>
</div>
<!-- Headlines -->
<div class="space-y-md mb-xxl">
<h1 class="font-h1 text-h1-mobile md:text-display text-on-surface">
                    Plan trips together, minus the chaos.
                </h1>
<p class="font-body text-body text-on-surface-variant max-w-[280px] mx-auto">
                    The minimalist group trip planner that feels like your favorite social apps.
                </p>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-md">
<button class="w-full h-[56px] bg-primary-container text-on-primary font-body-medium rounded-full hover:opacity-90 active:scale-95 transition-all shadow-sm">
                    Get Started
                </button>
<button class="w-full h-[56px] bg-surface border border-border-subtle text-on-surface font-body-medium rounded-full hover:bg-bg-warm active:scale-95 transition-all">
                    Log In
                </button>
</div>
<!-- Footer Small Print -->
<div class="mt-xl">
<p class="font-caption text-caption text-on-secondary-container">
                    By continuing, you agree to our <a class="underline" href="#">Terms of Service</a>
</p>
</div>

<!-- Decorative Blobs -->
<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-accent-tint/40 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
</main>
<!-- Bottom Navigation (Contextual Suppression Logic: Hidden because this is a Transactional/Welcome screen) -->
<script>
        // Micro-interactions for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
            button.addEventListener('mouseleave', () => {
                button.classList.remove('scale-95');
            });
        });

        // Simple enter animation for content blocks
        window.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('main > div > *');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'all 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });
    </script>
