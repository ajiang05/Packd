<script>
        const activities = [
            {
                title: "Private Boat Tour",
                image: "https://images.unsplash.com/photo-1534008843784-66c39f1349cd?auto=format&fit=crop&q=80&w=1000",
                desc: "Experience the Amalfi Coast from the water with a private skipper. Includes prosecco and swimming stops.",
                price: "$$",
                duration: "4 hours",
                contributor: "Sarah J.",
                votes: 3
            },
            {
                title: "Sunset Wine Tasting",
                image: "https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&q=80&w=1000",
                desc: "Guided tour through terraced vineyards overlooking the sea. Sample local varieties and artisanal cheeses.",
                price: "$$$",
                duration: "2 hours",
                contributor: "Mike R.",
                votes: 5
            },
            {
                title: "Cooking Class",
                image: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&q=80&w=1000",
                desc: "Learn to make authentic pasta from scratch in a local family kitchen in the hills of Ravello.",
                price: "$$",
                duration: "3 hours",
                contributor: "Emma L.",
                votes: 2
            }
        ];

        let currentIndex = 0;

        function handleVote(type) {
            const card = document.getElementById('active-card');
            
            // Animation direction
            const rotate = type === 'yes' ? 15 : -15;
            const translate = type === 'yes' ? 500 : -500;
            
            card.style.transform = `translateX(${translate}px) rotate(${rotate}deg)`;
            card.style.opacity = '0';

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % activities.length;
                updateCard();
                
                // Reset position for next card entry
                card.style.transition = 'none';
                card.style.transform = 'scale(0.9) translateY(20px)';
                card.style.opacity = '0';
                
                requestAnimationFrame(() => {
                    card.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease';
                    card.style.transform = 'translateX(0) rotate(0) scale(1) translateY(0)';
                    card.style.opacity = '1';
                });
            }, 350);
        }

        function updateCard() {
            const data = activities[currentIndex];
            document.getElementById('card-title').innerText = data.title;
            document.getElementById('card-desc').innerText = data.desc;
            document.getElementById('card-price').innerText = data.price;
            document.getElementById('card-duration').innerText = data.duration;
            // In a real app we'd swap images properly, here we update data-alt for the system
            // Note: Placeholder management handled by the injection pipeline
        }
    </script>
