<style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-bg-warm text-on-surface min-h-screen flex flex-col items-center overflow-x-hidden">
<!-- Top Navigation Suppression (Onboarding) -->
<header class="w-full max-w-md px-edge-mobile py-lg flex justify-end items-center">
<button class="text-on-surface-variant font-body-medium text-body-medium hover:opacity-80 transition-opacity">Skip</button>
</header>
<main class="flex-1 w-full max-w-md px-edge-mobile flex flex-col items-center justify-between pb-xxl">
<!-- Interactive Card Canvas -->
<div class="relative w-full aspect-[3/4] flex items-center justify-center mb-xl">
<!-- Background Decorative Elements -->
<div class="absolute inset-0 bg-primary/5 rounded-[40px] rotate-2 -z-10"></div>
<!-- Voting Card Component -->
<div class="bg-surface card-shadow rounded-[20px] w-full h-full overflow-hidden flex flex-col transition-all duration-500 ease-out" id="voting-card">
<div class="relative flex-1 overflow-hidden">
<div class="w-full h-full bg-cover bg-center" data-alt="A luxury private yacht gliding through crystal clear turquoise waters of the Mediterranean at sunset. The lighting is warm and golden, casting long shadows and highlighting the high-end minimalist design of the boat. The overall aesthetic is premium and tranquil, perfectly matching a warm, off-white UI palette with subtle pink and red accents. Professional travel photography style with deep depth of field." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuByFtdKj6nqbzM-18qznOQdpNqMpxSkDgSrSCV-cMOrtbsI6fIIz7zxKcvOM1d-c5DgD3bDW9Boun3ZvAQGncLjkjrTlTIrAPuseSWrdb906X8abyTD9gKs2vxva13cAh0JjzsD11EVXT5Fw2jeCDaqWsudTQ1EcZecUlTgLUvBXriO7ByyjNcHGQN7D6JkgKjUdfPdYOtwvUWW8WbAdBhlR4YYlrTxRl8QYaW3xVO-deSPSSDw514Y')">
</div>
<!-- Badge -->
<div class="absolute top-md left-md bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-primary">sailing</span>
<span class="font-label-caps text-label-caps text-on-surface">MUST TRY</span>
</div>
</div>
<div class="p-md space-y-md">
<div class="flex justify-between items-start">
<div>
<h2 class="font-h1 text-h1 text-on-surface">Private Boat Tour</h2>
<p class="font-body text-body text-ink-secondary">Positano Coastline • 4 hours</p>
</div>
<div class="bg-accent-tint text-primary px-3 py-1 rounded-lg">
<span class="font-body-medium text-body-medium">€120</span>
</div>
</div>
<!-- Vote Buttons -->
<div class="flex gap-sm w-full">
<button class="flex-1 h-14 rounded-[20px] bg-bg-warm border border-border-subtle flex items-center justify-center gap-2 active:scale-95 transition-transform group" onclick="animateVote('no')">
<span class="material-symbols-outlined text-secondary group-hover:text-error transition-colors">close</span>
<span class="font-body-medium text-body-medium text-on-surface">No</span>
</button>
<button class="flex-1 h-14 rounded-[20px] bg-primary flex items-center justify-center gap-2 active:scale-95 transition-transform group" onclick="animateVote('yes')">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="font-body-medium text-body-medium text-white">Yes</span>
</button>
</div>
</div>
</div>
</div>
<!-- Content Section -->
<div class="w-full text-center space-y-md mb-xl px-sm">
<h1 class="font-display text-display text-on-surface tracking-tight">Vote on your vibe.</h1>
<p class="font-body text-body text-on-surface-variant max-w-[280px] mx-auto">
                Propose activities and vote on them together. The most popular ones make the itinerary.
            </p>
</div>
<!-- Progress and Primary Action -->
<div class="w-full space-y-xl">
<!-- Progress Dots -->
<div class="flex justify-center gap-2">
<div class="w-2 h-2 rounded-full bg-border-subtle"></div>
<div class="w-6 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-border-subtle"></div>
</div>
<!-- Primary Button -->
<button class="w-full h-[56px] bg-primary text-white font-body-medium text-body-medium rounded-[20px] shadow-lg shadow-primary/20 active:scale-95 transition-all flex items-center justify-center group">
                Next
                <span class="material-symbols-outlined ml-2 group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</main>
<!-- Floating Atmosphere Script -->
<script>
        function animateVote(type) {
            const card = document.getElementById('voting-card');
            if (type === 'yes') {
                card.style.transform = 'translateX(150%) rotate(20deg)';
                card.style.opacity = '0';
            } else {
                card.style.transform = 'translateX(-150%) rotate(-20deg)';
                card.style.opacity = '0';
            }
            
            // Reset for visual feedback demonstration
            setTimeout(() => {
                card.style.transition = 'none';
                card.style.transform = 'scale(0.9) translateY(20px)';
                card.style.opacity = '0';
                setTimeout(() => {
                    card.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    card.style.transform = 'scale(1) translateY(0)';
                    card.style.opacity = '1';
                }, 50);
            }, 600);
        }

        // Lightweight entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('voting-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(30px) scale(0.95)';
            setTimeout(() => {
                card.style.transition = 'all 0.8s cubic-bezier(0.2, 1, 0.3, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0) scale(1)';
            }, 200);
        });
    </script>
