<body class="bg-bg-warm min-h-screen flex flex-col text-on-surface overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-40 bg-bg-warm flex justify-between items-center px-edge-mobile py-md w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</div>
<h1 class="font-display text-display text-primary dark:text-primary tracking-tight">Packd</h1>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high border border-border-subtle">
<img class="w-full h-full object-cover" data-alt="A clean, professional headshot of a smiling young traveler in their late 20s, with a soft-focus background of a sun-drenched European street. The lighting is warm and natural, aligning with the premium, minimalist aesthetic of the Packd travel app. The overall mood is approachable, modern, and high-end, featuring a color palette of soft creams and subtle skin tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBoxYqWRyGifIq23Q0W6zjD7epKPfOpd2k4yCbs01NmioB8M-vmEz4EhnePTB7PPLsf_BPpGotC0dna9X9TNhVVFO0ybWRb9uqj0p4t7FaBOS8UoAHFvdfp3YZxMtEn42oAzwFOVcRz_Pu_4jxO_uCW3oFRWSTp8QIbcSkWEkxG1piN_30E3YJbBSPSnH_5NDL60k2vM9rIMGR083CUaS6cJCQQ1EH8XCeg4aqpBir2vNvwSEoJ19XU"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-edge-mobile pt-xl pb-xxl max-w-md mx-auto w-full">
<!-- Welcome Message -->
<section class="mb-xl animate-in slide-in-from-bottom duration-700">
<h2 class="font-display text-display text-on-surface mb-xs">Let's get going.</h2>
<p class="font-body text-body text-on-surface-variant">Your next adventure starts with a single step. Choose how you want to begin.</p>
</section>
<!-- Action Cards Grid -->
<div class="grid grid-cols-1 gap-md">
<!-- Create a Trip Card -->
<button class="group active:scale-[0.98] transition-transform duration-200 text-left">
<div class="bg-surface rounded-card p-xl card-shadow flex flex-col items-start gap-lg border border-transparent hover:border-primary/10 transition-colors">
<div class="w-14 h-14 rounded-full bg-accent-tint flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined !text-[32px]" data-icon="add">add</span>
</div>
<div>
<h3 class="font-h1 text-h1 text-on-surface">Create a Trip</h3>
<p class="font-body text-body text-on-surface-variant mt-xs">Start a fresh plan, invite friends, and coordinate your itinerary.</p>
</div>
</div>
</button>
<!-- Join with Code Card -->
<button class="group active:scale-[0.98] transition-transform duration-200 text-left">
<div class="bg-surface rounded-card p-xl card-shadow flex flex-col items-start gap-lg border border-transparent hover:border-primary/10 transition-colors">
<div class="w-14 h-14 rounded-full bg-secondary-container/30 flex items-center justify-center text-secondary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined !text-[32px]" data-icon="vpn_key">vpn_key</span>
</div>
<div>
<h3 class="font-h1 text-h1 text-on-surface">Join with Code</h3>
<p class="font-body text-body text-on-surface-variant mt-xs">Have an invite? Enter the 6-digit code to join an existing group.</p>
</div>
</div>
</button>
</div>
<!-- Secondary Guidance -->
<div class="mt-auto pt-xl text-center">
<p class="font-caption text-caption text-ink-secondary">
                Need help? <a class="text-primary font-bold hover:underline" href="#">Explore our guide</a>
</p>
</div>
</main>
<!-- BottomNavBar (Suppressed for focused first-action screen per instructions, but kept hidden structural space if needed for logic) -->
<!-- The user is in a focused journey ("First Action"), so navigation shell is suppressed to prioritize the Canvas. -->
<script>
        // Micro-interactions for tactile feel
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('opacity-90');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('opacity-90');
            });
        });

        // Atmospheric fade-in effect on load
        window.addEventListener('DOMContentLoaded', () => {
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.5s ease-in-out';
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body></html>
